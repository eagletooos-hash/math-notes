<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة الرياضيات</title>

<style>

body{
font-family:Tahoma;
background:#f5f7fa;
margin:0;
padding:0;
}

header{
text-align:center;
padding:40px;
}

header h1{
font-size:50px;
margin-bottom:10px;
}

.cards{

display:flex;

justify-content:center;

gap:25px;

flex-wrap:wrap;

padding:40px;
}

.card{

width:300px;

height:220px;

background:white;

border-radius:20px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

text-decoration:none;

color:black;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
background:#2563eb;
color:white;
}

.icon{
font-size:60px;
margin-bottom:15px;
}

.title{
font-size:28px;
font-weight:bold;
}

</style>
</head>

<body>

<header>

<h1>📚 منصة الرياضيات</h1>

<p>اختر المرحلة الدراسية</p>

</header>

<div class="cards">

<a class="ss="icon">🎓</div>
<div class="title">الصف الأول الثانوي</div>
</a>

<a class="card" href="#">
<div iv class="title">الصف الثاني الثانوي</div>
</a>

</div>

</body>
</html>
